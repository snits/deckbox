[package]
name = "deckbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for managing decks of cards with draw-without-replacement semantics"

[[bin]]
name = "deckbox"
path = "src/main.rs"

[dependencies]
deckbox-core = { path = "../deckbox-core", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
