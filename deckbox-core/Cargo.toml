[package]
name = "deckbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A library for managing decks of cards with draw-without-replacement semantics"
keywords = ["cards", "deck", "ttrpg", "oracle", "game"]
categories = ["games"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.9"
rand = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
